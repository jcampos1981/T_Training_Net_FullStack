# Servicios locales para HelpDesk: SQL Server, PostgreSQL, Redis y Keycloak.
#
# Uso (desde la raíz del repo):
#   docker compose -f deploy/compose.yaml up -d      # levanta todo en segundo plano
#   docker compose -f deploy/compose.yaml ps         # estado y salud de cada servicio
#   docker compose -f deploy/compose.yaml logs -f sqlserver
#   docker compose -f deploy/compose.yaml stop       # detiene (los datos se conservan)
#   docker compose -f deploy/compose.yaml down -v    # elimina contenedores Y datos
#
# Las contraseñas se leen de deploy/.env (ignorado por git). Plantilla: deploy/.env.example

name: helpdesk

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en deploy/.env}
      # SQL Server toma toda la RAM que puede; lo limitamos para dejar aire al resto.
      MSSQL_MEMORY_LIMIT_MB: "4096"
    ports:
      # Solo accesible desde esta máquina, no desde la red. Se publica en IPv4 e IPv6
      # porque Windows resuelve "localhost" primero como ::1.
      # Desde SSMS/sqlcmd conéctate a "127.0.0.1,1433" (con coma): con el cliente de
      # SQL Server de Windows, "localhost" y el nombre del equipo no llegan al contenedor.
      - "127.0.0.1:1433:1433"
      - "[::1]:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Margen para el primer arranque: los datos de Docker están en un HDD (H:).
      start_period: 90s

  postgres:
    image: postgres:18-alpine
    # pg_stat_statements (estadísticas de cada consulta, como Query Store) solo se carga al arrancar el servidor.
    # track_io_timing: EXPLAIN (ANALYZE, BUFFERS) muestra también cuánto se tardó en leer del disco.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "track_io_timing=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    ports:
      # 5433 en Windows: el 5432 ya lo usa el PostgreSQL 13 instalado localmente.
      - "127.0.0.1:5433:5432"
      - "[::1]:5433:5432"
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos bajo /var/lib/postgresql/<versión>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Proveedor de identidad (OpenID Connect). Consola de administración: http://localhost:8080/admin
  # (usuario admin, contraseña KEYCLOAK_ADMIN_PASSWORD de deploy/.env).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # start-dev: HTTP, sin caché distribuida y con una base H2 dentro del contenedor. Solo para desarrollo.
    # --import-realm: si el realm "helpdesk" no existe, lo crea desde deploy/keycloak/ (el realm es código).
    # Sin volumen a propósito: "down" + "up" vuelve al realm del archivo. Lo que cambies en la consola se pierde
    # al recrear el contenedor; si quieres conservarlo, pásalo a helpdesk-realm.json.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD en deploy/.env}
      # helpdesk-realm.json la usa como ${HELPDESK_DEV_PASSWORD}: la contraseña no queda en el repositorio.
      HELPDESK_DEV_PASSWORD: ${HELPDESK_DEV_PASSWORD:?Falta HELPDESK_DEV_PASSWORD en deploy/.env}
      # Secreto del client helpdesk-bff; el BFF tiene el mismo en sus User Secrets (Keycloak:ClientSecret).
      HELPDESK_BFF_CLIENT_SECRET: ${HELPDESK_BFF_CLIENT_SECRET:?Falta HELPDESK_BFF_CLIENT_SECRET en deploy/.env}
      # URL pública fija: es el "iss" de los tokens, y la API lo compara con Keycloak:Authority.
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # La imagen no trae curl: bash abre la conexión al puerto de administración (9000) y pide /health/ready.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "HTTP/1.1 200" <&3']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  sqlserver-data:
  postgres-data:
  redis-data:
