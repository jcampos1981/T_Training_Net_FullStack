# StatefulSet y no Deployment: el pod conserva su nombre (sqlserver-0) y su disco, aunque se recree.
# Para practicar. En producción conviene una base administrada: backups, parches y alta disponibilidad no son trabajo de un manifiesto.
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: helpdesk
spec:
  clusterIP: None # headless: el DNS apunta directo al pod, sin balanceo
  selector:
    app.kubernetes.io/name: sqlserver
  ports:
    - name: sql
      port: 1433
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: helpdesk
spec:
  serviceName: sqlserver
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sqlserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlserver
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # el usuario mssql de la imagen
        runAsGroup: 10001
        fsGroup: 10001 # sin esto, el disco nuevo es de root y SQL Server no puede escribir
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2025-latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "2048"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpdesk-secrets
                  key: sa-password
          ports:
            - name: sql
              containerPort: 1433
          # El binario sqlservr lleva la capacidad de archivo NET_BIND_SERVICE. Sin ella en el conjunto, o con
          # allowPrivilegeEscalation: false, Linux no lo deja ejecutar ("Operation not permitted"). Por eso SQL Server llega al nivel
          # "baseline" de Pod Security Standards, y no al "restricted" de las aplicaciones.
          securityContext:
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "2", memory: 2560Mi }
          startupProbe:
            tcpSocket: { port: sql }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
            periodSeconds: 10
            timeoutSeconds: 8
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
