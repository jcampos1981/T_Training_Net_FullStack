# RabbitMQ con su disco. El chart de Bitnami ya no publica imágenes gratuitas; en producción conviene el operador oficial o un servicio administrado.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: helpdesk
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: helpdesk
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4-alpine
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: helpdesk }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: rabbitmq-password } }
          ports:
            - { name: amqp, containerPort: 5672 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_port_connectivity]
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
