{{- if .Values.gateway.enabled }}
# Gateway API separa quién administra la entrada (el Gateway) de quién publica una ruta (el HTTPRoute). Con Ingress, todo está en un
# recurso, y lo que no cabe en él termina en anotaciones propias de cada controlador, como las de Traefik en este chart.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: helpdesk
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 8000 # el puerto "web" de Traefik
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff
spec:
  parentRefs:
    - name: helpdesk
  hostnames:
    - {{ .Values.gateway.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bff
          port: 8080
{{- end }}
